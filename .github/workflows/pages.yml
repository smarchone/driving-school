# Publish the Driving School app (school/) as the GitHub Pages site.
name: Deploy school to Pages

on:
  push:
    branches: [main]
    paths: ['school/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site (app files only, no dev tools)
        run: |
          mkdir -p _site
          cp -r school/. _site/
          rm -rf _site/tools _site/package.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
