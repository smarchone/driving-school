<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Taste Test</title>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
  <style>
    :root { --glass: rgba(10, 12, 16, 0.72); --line: rgba(255, 255, 255, 0.1); --ink: #eef0f3; --mute: #9aa3ad; --accent: #37d6c8; --heart: #ff5d7a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; color: var(--ink); font: 14px/1.4 Inter, system-ui, -apple-system, sans-serif; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .panel { position: fixed; top: 16px; left: 16px; width: 300px; max-height: calc(100% - 32px); overflow: auto; background: var(--glass);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 14px; padding: 14px 12px; }
    .panel.hide { display: none; }
    h1 { font-size: 15px; margin: 0 4px 2px; letter-spacing: 0.01em; }
    .sub { color: var(--mute); font-size: 12px; margin: 0 4px 10px; }
    .grp { color: var(--accent); font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin: 12px 4px 4px; }
    .row { display: flex; align-items: flex-start; gap: 8px; padding: 7px 8px; border-radius: 9px; cursor: pointer; }
    .row:hover { background: rgba(255, 255, 255, 0.05); }
    .row.on { background: rgba(55, 214, 200, 0.14); box-shadow: inset 0 0 0 1px rgba(55, 214, 200, 0.4); }
    .row .t { flex: 1; min-width: 0; }
    .row b { font-weight: 600; font-size: 13.5px; }
    .row small { display: block; color: var(--mute); font-size: 11.5px; margin-top: 1px; }
    .heart { border: 0; background: none; color: #59606a; font-size: 17px; line-height: 1; padding: 2px 2px; cursor: pointer; }
    .heart.on { color: var(--heart); }
    .foot { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
    .btn { border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06); color: var(--ink); border-radius: 999px; padding: 6px 11px; font: 600 12px Inter, system-ui, sans-serif; cursor: pointer; }
    .btn:hover { background: rgba(255, 255, 255, 0.12); }
    .keys { color: var(--mute); font-size: 11px; margin: 10px 4px 0; }
    .hud { position: fixed; right: 16px; bottom: 16px; background: var(--glass); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px;
      font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--mute); text-align: right; }
    .hud .fps { font-size: 20px; color: var(--ink); }
    .hud .fps.warn { color: #f5b942; } .hud .fps.bad { color: #ff6b6b; }
    .title { position: fixed; right: 16px; top: 16px; text-align: right; pointer-events: none; text-shadow: 0 1px 12px rgba(0, 0, 0, 0.6); }
    .title b { display: block; font-size: 22px; letter-spacing: -0.01em; }
    .title span { color: rgba(255, 255, 255, 0.75); font-size: 13px; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--glass); border: 1px solid var(--line); border-radius: 999px;
      padding: 8px 14px; font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    .toast.show { opacity: 1; }
    @media (max-width: 640px) { .panel { width: calc(100% - 32px); max-height: 45%; top: auto; bottom: 16px; } .hud { bottom: auto; top: 76px; } }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div class="panel" id="panel">
    <h1>World taste test</h1>
    <div class="sub">Same road and car as the game, on autopilot. Heart the ones you'd drive in.</div>
    <div id="list"></div>
    <div class="foot">
      <button class="btn" id="b-cam">View: chase</button>
      <button class="btn" id="b-res">Res: native</button>
      <button class="btn" id="b-pause">Pause car</button>
      <button class="btn" id="b-copy">Copy picks</button>
    </div>
    <div class="keys">↑ ↓ switch · H heart · C camera · R resolution · P pause · U hide panel</div>
  </div>
  <div class="title" id="title"></div>
  <div class="hud" id="hud"></div>
  <div class="toast" id="toast"></div>
  <script type="module" src="./worlds.js"></script>
</body>
</html>
